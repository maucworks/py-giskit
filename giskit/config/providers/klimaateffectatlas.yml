provider:
  name: klimaateffectatlas
  title: Klimaateffectatlas Nederland
  country: NL
  homepage: https://www.klimaateffectatlas.nl
  license: CC-BY-4.0
  description: 'Dutch national climate adaptation atlas providing climate risk and vulnerability
    data including heat stress, flooding, drought impacts, and social vulnerability indicators.

    '
  maintainer: Sogelink Nederland & Climate Adaptation Services
  contact: https://www.klimaateffectatlas.nl/nl/contact
  attribution: 'Klimaateffectatlas Nederland, 2026'
services:
  # ---- Buurt-level dashboard (consolidates grijs/groen/water/paalrot/BKB per buurt) ----
  buurtdashboard:
    url: https://cas.cloud.sogelink.com/public/data/org/gws/YWFMLMWERURF/kea_public/wfs
    title: Buurtdashboard Klimaateffectatlas
    category: climate
    description: >
      Comprehensive neighbourhood dashboard consolidating green/grey/water surface percentages,
      paalrot risk, BKB scores (AHN3/4/5), shadow coverage, PET heat stress, groundwater levels,
      and social indicators per buurt. Replaces the former groen/grijs/water-per-buurt layers.
    keywords:
    - klimaat
    - buurten
    - groen
    - verharding
    - water
    - paalrot
    - hitte
    - dashboard
    quirks: []
    protocol: wfs
    collection: kea_public:BD_buurtdashboard_20260312

