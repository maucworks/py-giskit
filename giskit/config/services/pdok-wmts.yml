provider:
  name: pdok-wmts
  title: PDOK WMTS Services (Imagery & Maps)
  country: NL
  homepage: https://www.pdok.nl
  license: CC0-1.0
  defaults:
    protocol: wmts

services:
  luchtfoto:
    url: https://service.pdok.nl/hwh/luchtfotorgb/wmts/v1_0
    title: Luchtfoto Beeldmateriaal Nederland
    category: imagery
    description: Aerial imagery of the Netherlands (RGB orthophotos)
    keywords:
      - luchtfoto
      - aerial
      - imagery
      - orthophoto
      - rgb
    tile_format: jpeg
    tile_matrix_set: EPSG:28992
    resolutions: [3440.64, 1720.32, 860.16, 430.08, 215.04, 107.52, 53.76, 26.88, 13.44, 6.72, 3.36, 1.68, 0.84, 0.42, 0.21]
    layers:
      actueel_8cm: Actueel_orthoHR
      actueel_25cm: Actueel_ortho25
      2026_quicklook: 2026_quickorthoHR
      2025_8cm: 2025_orthoHR
      2025_25cm: 2025_ortho25
      2024_8cm: 2024_orthoHR
      2024_25cm: 2024_ortho25
      2023_8cm: 2023_orthoHR
      2023_25cm: 2023_ortho25
      2022_8cm: 2022_orthoHR
      2022_25cm: 2022_ortho25
      2021_8cm: 2021_orthoHR
      2020_25cm: 2020_ortho25
      2019_25cm: 2019_ortho25
      2018_25cm: 2018_ortho25
      2017_25cm: 2017_ortho25
      2016_25cm: 2016_ortho25

  luchtfoto-ir:
    url: https://service.pdok.nl/hwh/luchtfotocir/wmts/v1_0
    title: Luchtfoto Infrarood (CIR)
    category: imagery
    description: Aerial imagery infrared false-color (CIR - Color InfraRed)
    keywords:
      - luchtfoto
      - infrared
      - cir
      - false-color
    tile_format: jpeg
    tile_matrix_set: EPSG:28992
    layers:
      actueel_8cm: Actueel_orthoHRIR
      actueel_25cm: Actueel_ortho25IR
      2025_8cm: 2025_orthoHRIR
      2025_25cm: 2025_ortho25IR
      2024_25cm: 2024_ortho25IR
      2023_25cm: 2023_ortho25IR
      2022_25cm: 2022_ortho25IR
      2020_25cm: 2020_ortho25IR
      2019_25cm: 2019_ortho25IR
      2018_25cm: 2018_ortho25IR
      2017_25cm: 2017_ortho25IR
      2016_25cm: 2016_ortho25IR

  # satellite: removed - PDOK no longer serves this endpoint (HTTP 404 as of 2026)

  brt-achtergrondkaart:
    url: https://api.pdok.nl/kadaster/brt-achtergrondkaart/ogc/v1
    title: BRT Achtergrondkaart (OGC API)
    category: maps
    description: Background map derived from TOP10NL via OGC API (WMTS endpoint removed)
    keywords:
      - brt
      - topography
      - background
      - basemap
    protocol: ogc-features
    # Note: All WMTS versions (v1_0/v2_0/v3_0) return 404. Using OGC API instead.
